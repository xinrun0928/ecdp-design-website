<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    @keyframes kav-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .kav-ring { animation: kav-pulse 1.6s ease-in-out infinite; transform-origin: 16px 16px; }
    .kav-ring2 { animation: kav-pulse 1.6s ease-in-out 0.4s infinite; transform-origin: 16px 16px; }
  </style>
  <circle class="kav-ring" cx="16" cy="16" r="10.5" fill="none" stroke="#f5a623" stroke-width="2.5" opacity="0.9"/>
  <circle class="kav-ring2" cx="16" cy="16" r="6" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6"/>
  <circle cx="16" cy="16" r="2.8" fill="#f5a623" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
</svg>