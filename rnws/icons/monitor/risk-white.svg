<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    @keyframes kav-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.12); } }
    .kav-ring { animation: kav-pulse 1.8s ease-in-out infinite; transform-origin: 16px 16px; }
    .kav-ring2 { animation: kav-pulse 1.8s ease-in-out 0.6s infinite; transform-origin: 16px 16px; }
  </style>
  <circle class="kav-ring" cx="16" cy="16" r="11.5" fill="none" stroke="rgba(234,246,255,0.55)" stroke-width="1.2"/>
  <circle class="kav-ring2" cx="16" cy="16" r="7.6" fill="none" stroke="#eaf6ff" stroke-width="2"/>
  <circle cx="16" cy="16" r="3.4" fill="#eaf6ff" stroke="rgba(2,12,28,0.55)" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="6" fill="none" stroke="rgba(234,246,255,0.35)" stroke-width="4"/>
</svg>
